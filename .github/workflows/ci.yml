# A tool that reports checks which never ran has to answer for its own.
#
# It ships TWO HALVES from one tree -- `didrun` on PyPI and `@megapixel99/didrun` on
# npm, because npm refused the unscoped name as too similar to `madrun` -- and the
# gates below are this package's own properties pointed back at the package:
#
#   1. IT RUNS ITS OWN SUITES. `didrun` exists because a green run and a run of nothing
#      look identical, and a repository that reported "22 passed" while collecting
#      nothing would be the joke telling itself. Both suites are invoked THROUGH it,
#      with a floor on the test count.
#
#   2. AND IT CATCHES A SUITE THAT COLLECTED NOTHING. Gate 1 alone proves the happy
#      path; a tool that always said "ran and passed" would satisfy it. The negative
#      control runs a discover pattern that matches no file and requires exit 3.
#
#   3. THE TWO HALVES AGREE ABOUT THE VOCABULARY. The state names and exit codes are
#      what a CI file branches on, and a repo running the Python half in one job and the
#      JavaScript half in another must get the same answer from both.
#
# Action versions are pinned at v7 deliberately. Older majors still run, on a Node the
# runner silently substitutes, and a pin that is wrong for its own runtime is invisible
# in a pass/fail -- you only see it in an annotation nobody reads.
name: ci

on:
  push:
    # `master` only. A branch with an open PR matches both triggers and every job runs
    # twice, and a concurrency group does NOT fix it: the push event keys on
    # `refs/heads/<branch>` while the pull_request event keys on `<branch>`, so they
    # land in different groups.
    branches: [master]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this workflow rather than copying the jobs into itself. A
  # release gate that has drifted from the suite it claims to be is worse than no gate.
  workflow_call:

# The Python half lives in `python/` beside `js/`, and is still IMPORTED as `didrun`.
# Nothing here installs the package for the test jobs -- a tool that guards your build
# should not need a build of its own -- so the interpreter is told where to find it once.
env:
  PYTHONPATH: python

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what `pyproject.toml` claims, and the claim is checked rather
        # than trusted: `requires-python = ">=3.9"` is a promise, and a promise nothing
        # runs is the stale-documentation defect in a metadata file.
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # the parity tests shell out to it

      - name: no dependencies, and that is a design constraint
        # A tool that guards your build should not drag in a tree that can break it.
        # Asserted, because `dependencies = []` is a claim about the code, not a check.
        run: |
          if python3 -c "import didrun, didrun.core, didrun.cli, didrun.evidence" 2>&1 \
             | grep -q "ModuleNotFoundError"; then
            echo "::error::didrun imported something outside the standard library"
            exit 1
          fi
          python3 -c "import didrun; print('didrun', didrun.__version__)"

      - name: the suites
        run: python3 -m unittest discover -s python/tests -v

  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `package.json` says `>=20`, and `node:test` is what the suites use.
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: no dependencies here either
        run: |
          if [ -d node_modules ]; then
            echo "::error::node_modules is committed"
            exit 1
          fi
          node -e "const p=require('./package.json');
                   if (Object.keys(p.dependencies||{}).length) {
                     console.error('::error::package.json declares dependencies');
                     process.exit(1);
                   }
                   console.log(p.name, p.version)"

      - name: the suites
        run: node --test js/test/*.test.js

  versions:
    # THE VERSION LIVES IN THREE FILES AND THAT IS THREE PLACES TO DRIFT.
    # `pyproject.toml` is what PyPI publishes, `package.json` is what npm publishes, and
    # `__version__` is what a user who imports the package reads back. A release where
    # the first two agree and the third does not reports the wrong number to everybody
    # who asks it politely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: all three agree
        run: |
          set -euo pipefail
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./package.json').version")
          # Imported rather than grepped: this is the number a user actually gets back.
          # PYTHONDONTWRITEBYTECODE so the check leaves no `.pyc` for a later run to
          # read -- cache invalidation is keyed on mtime at one-second granularity.
          dunder=$(PYTHONDONTWRITEBYTECODE=1 python3 -c "import didrun; print(didrun.__version__)")
          echo "pyproject=$py  package.json=$js  __version__=$dunder"
          if [ "$py" != "$js" ] || [ "$py" != "$dunder" ]; then
            echo "::error::the three versions disagree"
            exit 1
          fi

  parity:
    # THE TWO HALVES AGREE ABOUT THE VOCABULARY, OR A CI FILE MEANS TWO THINGS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: the halves agree, and the test was not skipped
        # `skipUnless(node)` keeps the suite runnable for a Python-only contributor. In
        # CI a skip and a pass look identical in a tally, so the count is asserted --
        # which is this package's own rule applied to its own gate.
        run: |
          out=$(python3 -m unittest discover -s python/tests -p 'test_parity.py' -v 2>&1)
          echo "$out"
          if echo "$out" | grep -q "skipped"; then
            echo "::error::the parity tests were SKIPPED, so nothing checked the contract"
            exit 1
          fi
          ran=$(echo "$out" | grep -c " \.\.\. ok")
          echo "parity assertions that ran: $ran"
          if [ "$ran" -lt 4 ]; then
            echo "::error::expected at least 4 parity tests, saw $ran"
            exit 1
          fi

  itself:
    # The tool pointed at the tool. Runs once; the matrices above cover portability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: it runs its own Python suite, and counts the tests
        # A suite invoked through `didrun` cannot report a green run of nothing, which
        # is the entire thesis. The floor is below the current count on purpose: a
        # number that has to be edited with every new test is a number people edit
        # without reading.
        run: |
          python3 -m didrun.cli --expect-count "Ran (\d+) tests" --min 15 -- \
            python3 -m unittest discover -s python/tests

      - name: it runs its own JavaScript suite, and counts the tests
        run: |
          python3 -m didrun.cli --expect-count "pass (\d+)" --min 15 -- \
            node --test js/test/didrun.test.js

      - name: ...and it catches a suite that collected nothing
        # THE CONTROL FOR THE TWO STEPS ABOVE. Without it, a `didrun` that always said
        # "ran and passed" would satisfy them both — which is precisely the failure it
        # exists to report, in the tool that reports it.
        run: |
          set +e
          python3 -m didrun.cli --expect-count "Ran (\d+) tests" -- \
            python3 -m unittest discover -s python/tests -p 'no_such_pattern_*.py'
          code=$?
          set -e
          echo "exit=$code"
          if [ "$code" -ne 3 ]; then
            echo "::error::a suite that collected nothing was not reported as DID NOT RUN (exit $code)"
            exit 1
          fi

  cli:
    # The shipped entry points, exercised end to end.
    #
    # PYTHONPATH IS DELIBERATELY EMPTY HERE. The workflow-level `PYTHONPATH: python` is
    # what lets the test jobs import the package without installing it -- and it also
    # lets *pip* import it, which makes pip announce the package is already installed,
    # skip the install and produce no console script. The job that exists to prove the
    # built artifact works must not inherit the shortcut that makes the source
    # importable, or it is testing the source tree while believing it is testing a wheel.
    env:
      PYTHONPATH: ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: install the built artifacts, not the source tree
        run: |
          set -euo pipefail
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/dist
          npm pack --pack-destination /tmp/dist

          # A venv, and the script called by absolute path: installing into the
          # runner's interpreter puts the console script wherever that scheme says,
          # which is not always on PATH.
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install /tmp/dist/*.whl
          echo "venv scripts:"; ls -1 /tmp/venv/bin
          if [ ! -x /tmp/venv/bin/didrun ]; then
            echo '::error::the wheel installed but produced no didrun script'
            exit 1
          fi

          # BOTH HALVES SHIP A BINARY CALLED `didrun`, so a global install of each would
          # leave the PATH deciding which one this step tested. Each is run from its own
          # artifact instead.
          cd /tmp
          /tmp/venv/bin/didrun --help
          # A scoped package packs as `megapixel99-didrun-<version>.tgz`, so the tarball is
          # found rather than named.
          mkdir -p /tmp/tarball && tar -xzf /tmp/dist/*.tgz -C /tmp/tarball
          node /tmp/tarball/package/js/bin/didrun.js --help

      - name: both installed halves agree on the flagship case
        # `0 passed` on a zero exit is the case the package exists for. Both artifacts
        # must call it DID NOT RUN and both must exit 3 -- checked from the installed
        # artifacts rather than from the source, because that is what a user gets.
        run: |
          set +e
          /tmp/venv/bin/didrun --expect-count "(\d+) passed" -- \
            python3 -c "print('0 passed')" > /dev/null 2>&1
          py=$?
          node /tmp/tarball/package/js/bin/didrun.js --expect-count "(\d+) passed" -- \
            node -e "process.stdout.write('0 passed')" > /dev/null 2>&1
          js=$?
          set -e
          echo "python half exit=$py   javascript half exit=$js"
          if [ "$py" -ne 3 ] || [ "$js" -ne 3 ]; then
            echo "::error::the two installed halves disagree, or neither caught it"
            exit 1
          fi
